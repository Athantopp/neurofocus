<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Iniciar sesión')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-sm">
    <div style="margin-bottom: 28px;">
        <h1>Bienvenido de nuevo</h1>
        <p class="page-subtitle">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="card">
        <form action="/login" method="post">
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="username" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Ingresar</button>
        </form>
    </div>

    <p class="text-center text-muted mt-4">
        ¿No tienes cuenta? <a href="/registro">Regístrate</a>
    </p>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
