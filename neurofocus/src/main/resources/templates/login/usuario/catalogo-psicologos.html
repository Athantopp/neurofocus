<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de psicólogos — NeuroFocus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <span class="nav-brand">NeuroFocus</span>
        <form action="/logout" method="post">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container-md">
    <div style="margin-bottom: 28px;">
        <h1>Catálogo de psicólogos</h1>
        <p class="page-subtitle">Elige al especialista que mejor se adapte a tus necesidades</p>
    </div>

    <div th:each="psicologo : ${psicologos}" class="card" style="margin-bottom:16px;">
        <div class="card-header">
            <h3 th:text="${psicologo.usuario.nombre}"></h3>
        </div>
        <div class="detail-list">
            <div class="detail-row">
                <span class="detail-key">Especialidad</span>
                <span class="detail-val" th:text="${psicologo.especialidad}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-key">Horario</span>
                <span class="detail-val" th:text="${psicologo.horarioAtencion}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-key">Modalidad</span>
                <span class="detail-val" th:text="${psicologo.modalidad}"></span>
            </div>
        </div>
        <form th:action="@{/paciente/asignar-psicologo/{id}(id=${psicologo.id})}" method="post" style="margin-top:16px;">
            <button type="submit" class="btn btn-primary">Seleccionar este psicólogo</button>
        </form>
    </div>

    <div style="margin-top: 8px;">
        <a href="/dashboard-redirect" class="btn btn-secondary">Volver a mi panel</a>
    </div>
</div>

<footer class="footer">
    <p>NeuroFocus &mdash; Si estás en crisis llama al 911</p>
</footer>
</body>
</html>
