<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración — NeuroFocus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <span class="nav-brand">NeuroFocus</span>
        <form action="/logout" method="post">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div style="margin-bottom: 28px;">
        <h1>Administración</h1>
        <p class="page-subtitle">Panel de control del sistema</p>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Gestión de especialistas</h3>
            <p>Administra los psicólogos registrados en la plataforma</p>
            <a href="/admin/especialistas" class="btn btn-primary mt-4">Administrar psicólogos</a>
        </div>

        <div class="dashboard-card">
            <h3>Métricas globales</h3>
            <p>Reportes y estadísticas generales del sistema</p>
            <a href="/admin/metricas" class="btn btn-primary mt-4">Ver reportes</a>
        </div>
    </div>
</div>

<footer class="footer">
    <p>NeuroFocus &mdash; Plataforma de apoyo emocional</p>
</footer>
</body>
</html>
