<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis citas — NeuroFocus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <span class="nav-brand">NeuroFocus</span>
        <form action="/logout" method="post">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <div style="margin-bottom: 28px;">
        <h1>Mis citas</h1>
        <p class="page-subtitle">Citas agendadas contigo</p>
    </div>

    <div class="card">
        <div th:if="${citas.empty}" class="empty-state">
            <p>No tienes citas agendadas.</p>
        </div>

        <div th:if="${!citas.empty}" class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y hora</th>
                        <th>Paciente</th>
                        <th>Modalidad</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${cita.paciente.usuario.nombre}"></td>
                        <td th:text="${cita.modalidad}"></td>
                        <td th:text="${cita.estado}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="margin-top: 8px;">
        <a href="/psicologo/dashboard" class="btn btn-secondary">Volver al panel</a>
    </div>
</div>

<footer class="footer">
    <p>NeuroFocus &mdash; Plataforma de apoyo emocional</p>
</footer>
</body>
</html>
